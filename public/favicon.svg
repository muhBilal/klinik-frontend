<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" role="img" aria-label="e-klinik">
  <!-- Logo e-klinik: huruf K bersudut (batang tegak + dua lengan), latar transparan. Sumber tunggal logo aplikasi. -->
